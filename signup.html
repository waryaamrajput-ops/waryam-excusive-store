
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Exclusive Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-white text-slate-900">

  <!-- Navbar -->
  <header class="border-b border-slate-100">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">
      <a href="index.html" class="text-2xl font-bold tracking-tight">
        Exclusive<span class="text-[#DB4444]">.</span>
      </a>

      <a href="index.html"
         class="text-sm font-medium text-slate-600 transition hover:text-[#DB4444]">
        ← Back to Home
      </a>
    </nav>
  </header>

  <!-- Signup Section -->
  <main class="flex min-h-[80vh] items-center justify-center px-4 py-12">
    <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl shadow-slate-200/60">

      <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold tracking-tight">
          Create Account
        </h1>

        <p class="mt-3 text-sm text-slate-500">
          Create your Exclusive shopping account.
        </p>
      </div>

      <form id="signupForm" class="space-y-5">

        <!-- Full Name -->
        <div>
          <label for="fullName" class="mb-2 block text-sm font-semibold">
            Full name
          </label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
            class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none transition placeholder:text-slate-400 focus:border-[#DB4444] focus:ring-2 focus:ring-red-100"
          >
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-semibold">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
            class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none transition placeholder:text-slate-400 focus:border-[#DB4444] focus:ring-2 focus:ring-red-100"
          >
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="mb-2 block text-sm font-semibold">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
            class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none transition placeholder:text-slate-400 focus:border-[#DB4444] focus:ring-2 focus:ring-red-100"
          >
        </div>

        <!-- Create Account Button -->
        <button
          type="submit"
          class="w-full rounded-xl bg-[#DB4444] px-5 py-3.5 font-semibold text-white shadow-lg shadow-red-500/20 transition hover:bg-red-700 active:scale-[0.99]"
        >
          Create Account
        </button>

        <p
          id="signupMessage"
          role="status"
          aria-live="polite"
          class="text-center text-sm"
        ></p>

      </form>

      <!-- Login Link -->
      <div class="mt-7 border-t border-slate-100 pt-6 text-center">
        <p class="text-sm text-slate-500">
          Already have an account?
          <a href="login.html"
             class="ml-1 font-semibold text-[#DB4444] hover:underline">
            Login
          </a>
        </p>
      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-100 px-4 py-6 text-center text-sm text-slate-500">
    © <span id="year"></span> Exclusive Store. All rights reserved.
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    document.getElementById("signupForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("signupMessage");

      if (!name || !email || password.length < 6) {
        message.textContent = "Please complete all fields correctly.";
        message.className = "text-center text-sm text-red-600";
        return;
      }

      message.textContent =
        "Form validated successfully! Account creation needs backend integration.";
      message.className = "text-center text-sm text-green-600";
    });
  </script>

</body>
</html>
